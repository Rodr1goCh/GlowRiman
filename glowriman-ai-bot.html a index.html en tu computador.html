<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowRiman ✨ Asistente K-Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A1218;
    --cream: #FBF8F5;
    --blush: #F0D5CC;
    --rose: #C2705A;
    --gold: #BFA07A;
    --muted: #9A8880;
    --bubble-bot: #F5EDE9;
    --bubble-user: #C2705A;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .avatar-wrap {
    position: relative;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blush) 0%, var(--rose) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 0 2px rgba(191,160,122,.4);
  }
  .online-dot {
    width: 10px; height: 10px;
    background: #7DC98F;
    border-radius: 50%;
    border: 2px solid var(--ink);
    position: absolute; bottom: 1px; right: 1px;
  }
  .header-text { flex: 1; }
  .header-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 600;
    color: #fff; letter-spacing: .04em;
  }
  .header-sub {
    font-size: 11px; color: var(--gold);
    letter-spacing: .06em; text-transform: uppercase;
    margin-top: 1px;
  }
  .powered {
    font-size: 10px; color: rgba(255,255,255,.25);
    letter-spacing:.04em;
  }

  /* ── MESSAGES ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp .3s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:none; }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blush), var(--rose));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }

  .bubble {
    max-width: min(72%, 360px);
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .bubble.bot {
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble a { color: var(--gold); }
  .bubble.user a { color: rgba(255,255,255,.85); }

  /* typing indicator */
  .typing-row { display: flex; align-items: flex-end; gap: 8px; }
  .typing-bubble {
    background: var(--bubble-bot);
    border-radius: 18px; border-bottom-left-radius: 4px;
    padding: 13px 16px;
    display: flex; gap: 5px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: bounce .9s infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* quick replies */
  .quick-wrap {
    display: flex; flex-wrap: wrap; gap: 7px;
    padding: 4px 0 6px 36px;
    animation: fadeUp .3s ease;
  }
  .quick-btn {
    background: #fff;
    border: 1.5px solid var(--blush);
    border-radius: 30px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .quick-btn:hover {
    background: var(--blush);
    border-color: var(--rose);
  }

  /* ── INPUT ── */
  .input-area {
    padding: 12px 16px 16px;
    background: #fff;
    border-top: 1px solid #EDE6E2;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #userInput {
    flex: 1;
    border: 1.5px solid var(--blush);
    border-radius: 24px;
    padding: 11px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    resize: none;
    max-height: 100px;
    transition: border .2s;
    line-height: 1.4;
  }
  #userInput:focus { border-color: var(--rose); }
  #userInput::placeholder { color: var(--muted); }

  #sendBtn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--rose);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
    box-shadow: 0 2px 8px rgba(194,112,90,.35);
  }
  #sendBtn:hover { background: #A85A45; transform: scale(1.05); }
  #sendBtn:disabled { background: var(--muted); transform: none; box-shadow: none; cursor: not-allowed; }
  #sendBtn svg { width:18px; height:18px; fill:#fff; }

  /* scrollbar */
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--blush); border-radius: 2px; }

  /* ── WHATSAPP BUTTON ── */
  .wa-fab {
    position: fixed;
    bottom: 82px;
    right: 16px;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 9px;
    background: #25D366;
    color: #fff;
    border-radius: 30px;
    padding: 10px 16px 10px 12px;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 4px 16px rgba(37,211,102,.45);
    transition: all .2s;
    animation: waPulse 2.5s ease-in-out infinite;
  }
  .wa-fab:hover {
    background: #1ebe5c;
    transform: scale(1.04);
    box-shadow: 0 6px 20px rgba(37,211,102,.55);
  }
  .wa-fab svg { width: 20px; height: 20px; fill: #fff; flex-shrink:0; }
  @keyframes waPulse {
    0%,100% { box-shadow: 0 4px 16px rgba(37,211,102,.45); }
    50%      { box-shadow: 0 4px 24px rgba(37,211,102,.75); }
  }
</style>
</head>
<body>

<header>
  <div class="avatar-wrap">
    <div class="avatar">✨</div>
    <div class="online-dot"></div>
  </div>
  <div class="header-text">
    <div class="header-name">GlowRiman</div>
    <div class="header-sub">Asistente K-Beauty · Colombia</div>
  </div>
  <div class="powered">IA</div>
</header>

<!-- WhatsApp floating button -->
<a class="wa-fab" href="https://wa.me/573334004576?text=Hola!%20Vi%20el%20bot%20de%20GlowRiman%20y%20quiero%20hablar%20con%20una%20asesora%20%F0%9F%8C%B8" target="_blank">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  Hablar con asesora
</a>

<div id="messages"></div>

<div class="input-area">
  <textarea id="userInput" rows="1" placeholder="Escríbeme lo que necesitas…"></textarea>
  <button id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
  </button>
</div>

<script>
const SYSTEM_PROMPT = `Eres Glow, la asistente virtual de GlowRiman, distribuidora oficial de RIMAN en Colombia. 
Tu personalidad: cálida, cercana, entusiasta de la K-Beauty, pero sin ser exagerada. Hablas como una amiga experta en skincare.

SOBRE RIMAN Y GLOWRIMAN:
- RIMAN es una marca de K-Beauty (cosmética coreana) en pre-lanzamiento en Colombia
- El código de distribuidora es AURUM
- Tienda online: https://aurum.riman.com
- Registro como distribuidora: https://join.riman.com/country-language?siteurl=aurum
- Catálogo compartible: https://mall.riman.com/aurum
- Redes sociales: @glowriman.co en TikTok e Instagram

LÍNEAS DE PRODUCTOS:
1. ICD Skincare — Ritual coreano de 8 pasos: limpieza, tónico, esencia, suero, contorno de ojos, crema, protector solar y mascarilla. Ingredientes clave: niacinamida, retinol, péptidos, extractos botánicos.
2. GlowQueen (ICD Makeup) — Maquillaje K-Beauty: bases, BB cream, labiales, sombras, iluminadores. Larga duración, cuida la piel.
3. Botalab — Fórmulas biotecnológicas con activos botánicos. Para pieles exigentes o sensibles.
4. Lifening — Bienestar, suplementos y nutrición celular.

OPORTUNIDAD DE NEGOCIO:
- Se puede ingresar como Distribuidora con inversión mínima
- Beneficios: descuentos del 20-40% en productos, comisiones por ventas, bonos de equipo
- Colombia está en fase de pre-lanzamiento = ventaja de ser de las primeras
- Para registrarse: https://join.riman.com/country-language?siteurl=aurum

REGLAS DE CONVERSACIÓN:
- Responde siempre en español, de forma breve y natural (máx 3-4 párrafos cortos)
- No uses listas largas ni bullets excesivos. Sé conversacional.
- Si preguntan por precios exactos, diles que varían según el mercado colombiano y que pueden ver la tienda o pedirte asesoría personalizada
- Si quieren hablar con una persona real, diles que pueden escribir directamente a @glowriman.co en Instagram o WhatsApp
- Al final de respuestas sobre productos, haz UNA pregunta para seguir la conversación
- No inventes ingredientes, precios o productos que no estén en la info que tienes
- Usa emojis con moderación (1-2 por mensaje máximo)
- Si no sabes algo, sé honesta y ofrece conectar con la asesora`;

let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBotBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar">✨</div>
    <div class="bubble bot">${formatText(text)}</div>`;
  messagesEl.appendChild(row);
  scrollBottom();
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble user">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(row);
  scrollBottom();
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'typing-row'; el.id = 'typing';
  el.innerHTML = `<div class="msg-avatar">✨</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

function addQuickReplies(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-wrap';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = o;
    btn.onclick = () => {
      wrap.remove();
      triggerSend(o);
    };
    wrap.appendChild(btn);
  });
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function removeQuickReplies() {
  document.querySelector('.quick-wrap')?.remove();
}

function formatText(t) {
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>')
    .replace(/\n/g,'<br>');
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function callClaude(userMsg) {
  history.push({ role: 'user', content: userMsg });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: history
    })
  });

  const data = await response.json();
  const reply = data.content?.[0]?.text || 'Lo siento, hubo un error. ¿Puedes repetirlo?';
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function triggerSend(text) {
  if (isLoading || !text.trim()) return;
  isLoading = true;
  sendBtn.disabled = true;
  removeQuickReplies();

  addUserBubble(text);
  const typing = addTyping();

  try {
    const reply = await callClaude(text);
    removeTyping();
    addBotBubble(reply);

    // Suggest quick replies based on conversation depth
    if (history.length <= 4) {
      addQuickReplies(['💄 Ver productos', '💰 Precios', '✨ Oportunidad de negocio']);
    }
  } catch(e) {
    removeTyping();
    addBotBubble('Ups, tuve un pequeño problema técnico. ¿Lo intentamos de nuevo? 🌸');
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  await triggerSend(text);
}

// Enter to send, Shift+Enter for newline
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});

// ── WELCOME ──
async function welcome() {
  const typing = addTyping();
  await new Promise(r => setTimeout(r, 900));
  removeTyping();
  addBotBubble('¡Hola! 🌸 Soy Glow, tu asistente de K-Beauty.\n\n¿En qué te puedo ayudar hoy?');
  addQuickReplies(['💄 Conocer productos', '💰 Precios y cómo comprar', '✨ Oportunidad de negocio', '💬 Hablar con asesora']);
}

welcome();
</script>
</body>
</html>
